<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Paper background -->
  <rect width="512" height="512" rx="96" ry="96" fill="#F1E6CE"/>
  <!-- Inner safe area padding from edges to look good as a maskable icon -->
  <rect x="40" y="40" width="432" height="432" rx="72" ry="72" fill="#F1E6CE"/>

  <!-- Top thin double rule -->
  <line x1="96" y1="140" x2="416" y2="140" stroke="#1F1A14" stroke-width="3"/>
  <line x1="96" y1="150" x2="416" y2="150" stroke="#1F1A14" stroke-width="1"/>

  <!-- Bottom thin rule -->
  <line x1="96" y1="372" x2="416" y2="372" stroke="#1F1A14" stroke-width="1"/>

  <!-- Wordmark: an editorial "M" in deep burgundy serif -->
  <text x="256" y="310"
        font-family="Fraunces, 'Source Serif 4', Georgia, serif"
        font-size="280"
        font-weight="600"
        font-style="italic"
        text-anchor="middle"
        fill="#6E1F2C">M</text>

  <!-- Small kicker above the M -->
  <text x="256" y="125"
        font-family="-apple-system, 'Inter Tight', Helvetica, sans-serif"
        font-size="22"
        font-weight="700"
        letter-spacing="6"
        text-anchor="middle"
        fill="#1F1A14">LA MATINALE</text>

  <!-- Date marker below -->
  <text x="256" y="408"
        font-family="-apple-system, 'Inter Tight', Helvetica, sans-serif"
        font-size="20"
        font-weight="600"
        letter-spacing="3"
        text-anchor="middle"
        fill="#5C4D3F">ÉDITION DU MATIN</text>
</svg>
